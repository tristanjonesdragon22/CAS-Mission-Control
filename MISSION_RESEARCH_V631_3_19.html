<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mission Research V631.3.19</title><style>body{font:16px system-ui;background:#101b2c;color:#eef4ff;max-width:850px;margin:auto;padding:20px}textarea,input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 14px;border-radius:8px;border:1px solid #668;background:#20334d;color:white}button{background:#235db3}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172941;padding:15px;border-radius:8px}label{display:block}</style><h1>Mission Research · V631.3.19</h1><p>Iterative research for supported mathematical missions. Edit the JSON mission and run a bounded parameter study.</p><label>Mission JSON<textarea id="mission" rows="10">{"stages":[{"type":"robot","mass_kg":10,"force_N":20,"duration_s":10,"friction_coefficient":0}]}</textarea></label><label>Parameter<input id="param" value="force_N"></label><label>Metric<input id="metric" value="distance_m"></label><label>Target (optional)<input id="target" type="number" value="100"></label><button id="run">Run research</button><button id="export">Export last report</button><pre id="output">Ready.</pre><script src="mission_engineering_v631_3_10.js"></script><script src="mission_lab_v631_3_17.js"></script><script src="mission_discovery_v631_3_18.js"></script><script src="mission_research_v631_3_19.js"></script><script>let last;document.getElementById('run').onclick=()=>{try{const mission=JSON.parse(document.getElementById('mission').value);const t=document.getElementById('target').value;last=CASMissionResearch319.research(mission,{parameter:document.getElementById('param').value,metric:document.getElementById('metric').value,...(t!==''?{target:Number(t)}:{})});document.getElementById('output').textContent=JSON.stringify(last,null,2)}catch(e){document.getElementById('output').textContent='Error: '+e.message}};document.getElementById('export').onclick=()=>{if(!last)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));a.download='mission_research_319.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
