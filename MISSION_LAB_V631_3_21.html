<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Engineering Lab V631.3.21</title><style>body{font:16px system-ui;background:#101b2c;color:#f0f5ff;max-width:940px;margin:auto;padding:20px}textarea,input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0 12px;background:#20334d;color:white;border:1px solid #7789a8;border-radius:8px}button{background:#245ba6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2d46;padding:15px}label{display:block}</style><h1>Universal Mission Engineering Lab · V631.3.21</h1><p>Offline engineering research with transparent equations, mission-wide bounded optimization, and deterministic scenario analysis. Verify the interpreted parameters.</p><label>Mission description<textarea id="description" rows="3">A 10 kg robot with 20 newtons force for 10 seconds in 2 stages</textarea></label><button id="interpret">Interpret description</button><label>Mission JSON<textarea id="mission" rows="9">{"stages":[{"type":"robot","mass_kg":10,"force_N":20,"duration_s":10,"friction_coefficient":0},{"type":"robot","mass_kg":10,"force_N":20,"duration_s":10,"friction_coefficient":0}]}</textarea></label><label>Controls JSON<textarea id="controls" rows="4">[{"stage":0,"parameter":"force_N","min":10,"max":40},{"stage":1,"parameter":"force_N","min":10,"max":40}]</textarea></label><label>Metric<input id="metric" value="distance_m"></label><label>Target<input id="target" type="number" value="300"></label><button id="model">Inspect equations and model</button><button id="uncertainty">Run uncertainty scenarios</button><button id="research">Optimize and research</button><button id="save">Save result to local research history</button><button id="history">Show research history</button><button id="export">Export JSON report</button><pre id="output">Ready.</pre><script src="mission_engineering_v631_3_10.js"></script><script src="mission_discovery_v631_3_20.js"></script><script src="mission_lab_v631_3_21.js"></script><script>let last=null;const el=id=>document.getElementById(id),show=x=>{last=x;el('output').textContent=JSON.stringify(x,null,2)},mission=()=>JSON.parse(el('mission').value),controls=()=>JSON.parse(el('controls').value),opts=()=>({controls:controls(),metric:el('metric').value,...(el('target').value===''?{}:{target:Number(el('target').value)})});function safe(f){try{f()}catch(e){el('output').textContent='Error: '+e.message}}el('interpret').onclick=()=>safe(()=>{const r=CASMissionDiscovery320.parse(el('description').value);el('mission').value=JSON.stringify(r.mission,null,2);show(r)});el('model').onclick=()=>safe(()=>show(CASMissionLab321.model(mission())));el('uncertainty').onclick=()=>safe(()=>show(CASMissionLab321.uncertainty(mission(),{controls:controls(),metric:el('metric').value,levels:3})));el('research').onclick=()=>safe(()=>show(CASMissionLab321.research(mission(),opts())));el('save').onclick=()=>safe(()=>{if(!last)throw Error('Run a study first');const key='cas_mission_lab_321_history',a=JSON.parse(localStorage.getItem(key)||'[]');a.unshift({saved_at:new Date().toISOString(),result:last});localStorage.setItem(key,JSON.stringify(a.slice(0,30)));el('output').textContent='Saved to local browser storage (up to 30 records).'});el('history').onclick=()=>safe(()=>show(JSON.parse(localStorage.getItem('cas_mission_lab_321_history')||'[]')));el('export').onclick=()=>safe(()=>{if(!last)throw Error('Run a study first');const u=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='mission_lab_321.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});</script></html>
