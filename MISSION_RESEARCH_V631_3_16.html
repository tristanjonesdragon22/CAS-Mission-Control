<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Research V631.3.16</title><style>body{font:16px system-ui;background:#101b2a;color:#f2f6ff;padding:18px}main{max-width:900px;margin:auto}textarea,input,select{background:#20364c;color:white;border:1px solid #89a9c8;border-radius:6px;padding:9px;box-sizing:border-box}textarea{width:100%;height:100px}button{padding:11px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#20364c;padding:15px}a{color:#a8dbff}</style><main><h1>Mission Research · V631.3.16</h1><p>Plan supported missions and run bounded multi-stage, multi-variable experiments offline. Simplified models only.</p><textarea id="description">Simulate a robotic vehicle with mass 10 force 20 duration 10 target distance 100</textarea><p><button id="plan">Build architecture</button><button id="simulate">Simulate</button></p><h2>Adaptive experiment</h2><p>Research controls (editable JSON). Stage indexes start at 0.</p><textarea id="controls">[{"stage":0,"parameter":"force_N","min":5,"max":35},{"stage":0,"parameter":"mass_kg","min":8,"max":12}]</textarea><p>Metric <select id="metric"><option>distance_m</option><option>velocity_m_s</option><option>delta_v_m_s</option><option>kinetic_energy_J</option></select> Target <input id="target" type="number" value="100" step="any"></p><p><button id="research">Run research</button><button id="export">Export JSON</button></p><pre id="out" aria-live="polite">Ready</pre><a href="MISSION_DISCOVERY_V631_3_15.html">Previous Mission Discovery</a></main><script src="mission_engineering_v631_3_10.js"></script><script src="mission_intelligence_v631_3_11.js"></script><script src="mission_designer_v631_3_12.js"></script><script src="mission_science_v631_3_13.js"></script><script src="mission_engineering_v631_3_14.js"></script><script src="mission_discovery_v631_3_15.js"></script><script src="mission_research_v631_3_16.js"></script><script>let last;const $=id=>document.getElementById(id),desc=()=> $('description').value;function show(fn){try{last=fn();$('out').textContent=JSON.stringify(last,null,2)}catch(e){$('out').textContent='Error: '+e.message}}$('plan').onclick=()=>show(()=>CASMissionResearch316.architecture(desc()));$('simulate').onclick=()=>show(()=>CASMissionDiscovery315.execute(desc()));$('research').onclick=()=>show(()=>CASMissionResearch316.research(CASMissionDiscovery315.plan(desc()).mission,{controls:JSON.parse($('controls').value),metric:$('metric').value,target:Number($('target').value)}));$('export').onclick=()=>{if(!last)return;const url=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='mission_research_631_3_16.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
