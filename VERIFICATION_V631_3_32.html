<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.32 Verification</title><style>body{background:#101c2c;color:#eff6ff;font:16px system-ui;max-width:900px;margin:auto;padding:20px}input,select,button,textarea{background:#223952;color:white;border:1px solid #7393b3;border-radius:7px;padding:10px;margin:5px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172b40;padding:15px}label{display:inline-flex;flex-direction:column}h1{font-size:25px}</style></head><body><h1>Mathematical Verification &amp; Scientific Reliability</h1><p>CAS V631.3.32 — independent benchmarks, unit identities, conservation diagnostics and step-size consistency checks. Offline.</p><label>Model<select id="kind"><option value="robot">1D robot</option><option value="orbit">2D orbit</option></select></label><label>Model parameters (JSON)<textarea id="params" rows="7" cols="48">{"mass_kg":10,"force_N":20,"duration_s":10,"steps":100}</textarea></label><p><button id="run">Verify model</button><button id="units">Check equation dimensions</button><button id="export">Export report</button></p><pre id="output">Choose a model and run verification.</pre><script src="physics_engine_v631_3_29.js"></script><script src="unified_math_core_v631_3_27.js"></script><script src="model_builder_v631_3_28.js"></script><script src="research_planner_v631_3_30.js"></script><script src="engineering_core_v631_3_31.js"></script><script src="verification_engine_v631_3_32.js"></script><script>const $=x=>document.getElementById(x);let last=null;function show(x){last=x;$('output').textContent=JSON.stringify(x,null,2)}$('kind').onchange=()=>{$('params').value=$('kind').value==='orbit'?JSON.stringify({body:'earth',altitude_m:400000,duration_s:5400,steps:600},null,2):JSON.stringify({mass_kg:10,force_N:20,duration_s:10,steps:100},null,2)};$('run').onclick=()=>{try{show(CASVerification332.verifyPhysics($('kind').value,JSON.parse($('params').value)))}catch(e){$('output').textContent='Error: '+e.message}};$('units').onclick=()=>show(CASVerification332.dimensionalChecks());$('export').onclick=()=>{if(!last)return;const u=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='cas-verification-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script></body></html>
