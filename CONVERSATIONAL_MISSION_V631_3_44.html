<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.44 Conversational Mission Assistant</title><style>body{font:16px system-ui;background:#101b2b;color:#f1f5fb;max-width:880px;margin:auto;padding:18px}textarea,input,button{font:inherit;padding:11px;border-radius:8px;margin:5px 0;box-sizing:border-box}textarea{width:100%;height:90px}input{width:75%}button{background:#3169b3;color:white;border:0;margin-right:8px}pre{background:#1c3048;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a6d7ff}</style></head><body><h1>CAS V631.3.44 · Conversational Mission Assistant</h1><p>Offline, rule-based step-by-step mission guidance. No external AI model is included.</p><h2>Start a mission</h2><textarea id="mission">I want to design a robotic exploration vehicle for Mars and develop it step by step.</textarea><button id="create">Create mission</button><h2>Talk to Mission Director</h2><input id="message" placeholder="Try: next step, questions, status, complete step"><button id="send">Send</button><button id="next">Next step</button><button id="questions">Questions</button><button id="status">Status</button><h2>Conversation</h2><pre id="chat" aria-live="polite">Create a mission to begin.</pre><button id="export">Export project JSON</button><input id="import" type="file" accept=".json,application/json"><p><a href="ENGINEERING_DESIGN_V631_3_43.html">Engineering Design</a> · <a href="ENGINEERING_LAB_V631_3_42.html">Engineering Laboratory</a></p>
<script src="mission_director_v631_3_38.js"></script><script src="mission_planner_v631_3_39.js"></script><script src="engineering_core_v631_3_31.js"></script><script src="connected_equations_v631_3_34.js"></script><script src="mission_architect_v631_3_40.js"></script><script src="research_knowledge_v631_3_41.js"></script><script src="engineering_lab_v631_3_42.js"></script><script src="engineering_design_v631_3_43.js"></script><script src="conversational_mission_v631_3_44.js"></script><script>const $=id=>document.getElementById(id),A=CASConversationalMission344;let p=null;function show(v){$('chat').textContent=v}function send(t){try{if(!p)throw Error('Create or import a mission first');let r=A.respond(p,t);p=r.project;show(p.conversation.messages.map(m=>(m.role==='user'?'You: ':'Mission Director: ')+m.text).join('\n\n'))}catch(e){show('Error: '+e.message)}}$('create').onclick=()=>{try{p=A.init($('mission').value);show('Mission created. Ask for next step or questions.')}catch(e){show('Error: '+e.message)}};$('send').onclick=()=>{send($('message').value);$('message').value=''};$('message').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('send').click()}};$('next').onclick=()=>send('next step');$('questions').onclick=()=>send('questions');$('status').onclick=()=>send('status');$('export').onclick=()=>{if(!p)return show('Create a mission first');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([A.exportJSON(p)],{type:'application/json'}));a.download='cas_mission_v631_3_44.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{try{p=A.importJSON(await e.target.files[0].text());show('Mission imported. Ask for next step.')}catch(err){show('Error: '+err.message)}};</script></body></html>
