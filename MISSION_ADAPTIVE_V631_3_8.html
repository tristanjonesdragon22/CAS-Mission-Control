<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.8 Adaptive Mission Control</title><style>body{background:#0b1729;color:#edf5ff;font:16px system-ui;margin:0;padding:18px}main{max-width:980px;margin:auto}textarea,input,select{background:#192c45;color:white;border:1px solid #7794b2;border-radius:6px;padding:10px;font:inherit}textarea{width:100%;height:95px;box-sizing:border-box}label{display:inline-flex;flex-direction:column;gap:5px;margin:7px}button{padding:12px;margin:5px;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#182b45;padding:15px;border-radius:8px}a{color:#a3ddff}</style><main><h1>Universal Mission Control · V631.3.8</h1><p>Adaptive numerical optimization, uncertainty sweeps, and connected engineering calculations. Offline and rule-based; not autonomous AI.</p><textarea id="description">Simulate a robot mass 10 kg force 20 N duration 10 seconds friction 0.05</textarea><p><button id="simulate">Simulate</button><button id="optimize">Adaptive Optimize</button><button id="uncertainty">Uncertainty Sweep</button><button id="export">Export JSON</button></p><label>Variable<input id="variable" value="force"></label><label>Metric<input id="metric" value="distance_m"></label><label>Minimum<input id="min" type="number" value="5"></label><label>Maximum<input id="max" type="number" value="40"></label><label>Target<input id="target" type="number" value="100"></label><label>Uncertainty %<input id="percent" type="number" value="5"></label><pre id="output" aria-live="polite">Ready. For projectiles use variable angle, metric range_m, and a range such as 5–85.</pre><p><a href="MISSION_ENGINEERING_V631_3_7.html">Previous engineering workspace</a> · <a href="index.html">Home</a></p></main><script src="mission_reasoning_v631_3_4.js"></script><script src="mission_universal_v631_3_5.js"></script><script src="mission_architect_v631_3_6.js"></script><script src="mission_engineering_v631_3_7.js"></script><script src="mission_adaptive_v631_3_8.js"></script><script>let last;const el=id=>document.getElementById(id);function show(fn){try{last=fn();el('output').textContent=JSON.stringify(last,null,2)}catch(e){el('output').textContent='Error: '+e.message}}const d=()=>el('description').value;el('simulate').onclick=()=>show(()=>CASAdaptiveEngineering308.simulate(d()));el('optimize').onclick=()=>show(()=>CASAdaptiveEngineering308.optimize(d(),{variable:el('variable').value,metric:el('metric').value,min:Number(el('min').value),max:Number(el('max').value),target:Number(el('target').value)}));el('uncertainty').onclick=()=>show(()=>CASAdaptiveEngineering308.uncertainty(d(),{variable:el('variable').value,metric:el('metric').value,percent:Number(el('percent').value)}));el('export').onclick=()=>{if(!last)return;const url=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='mission_v631_3_8.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
