<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.12 Mission Designer</title><style>body{background:#101c2b;color:#f2f6fd;font:16px system-ui;margin:0;padding:20px}main{max-width:1000px;margin:auto}textarea,input{box-sizing:border-box;width:100%;background:#20374e;color:white;border:1px solid #8ba7c0;border-radius:7px;padding:10px;font:inherit}textarea{height:120px}button{padding:12px;margin:5px;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2e43;padding:16px}a{color:#a7dcff}</style><main><h1>Mission Designer · V631.3.12</h1><p>Describe a supported mission, inspect and edit its plan, simulate, optimize, and export. Offline rule-based modeling; not autonomous AI.</p><label for="description">Mission description</label><textarea id="description">Simulate a robotic vehicle with mass 10 force 20 duration 10 target distance 100 maximum speed 30</textarea><p><button id="build">Build plan</button><button id="run">Simulate</button><button id="opt">Optimize</button><button id="analyze">Analyze mission</button><button id="export">Export</button></p><label for="plan">Editable mission plan (JSON)</label><textarea id="plan" style="height:240px"></textarea><pre id="output" aria-live="polite">Ready.</pre><a href="MISSION_INTELLIGENCE_V631_3_11.html">Previous Mission Director</a></main><script src="mission_engineering_v631_3_10.js"></script><script src="mission_intelligence_v631_3_11.js"></script><script src="mission_designer_v631_3_12.js"></script><script>const api=CASMissionDesigner312,output=document.getElementById('output'),box=document.getElementById('plan');let report;function show(x){report=x;output.textContent=JSON.stringify(x,null,2)}function guarded(fn){try{show(fn())}catch(e){output.textContent='Error: '+e.message}}function get(){return JSON.parse(box.value)}document.getElementById('build').onclick=()=>guarded(()=>{const p=api.design(document.getElementById('description').value);box.value=JSON.stringify(p,null,2);return p});document.getElementById('run').onclick=()=>guarded(()=>api.simulate(get()));document.getElementById('opt').onclick=()=>guarded(()=>api.optimize(get()));document.getElementById('analyze').onclick=()=>guarded(()=>api.analyze(get()));document.getElementById('export').onclick=()=>{if(!report)return;const u=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='mission_v631_3_12.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.getElementById('build').click();</script></html>
