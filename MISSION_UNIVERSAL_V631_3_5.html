<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.5 Universal Mission Modeling</title><style>body{font:16px system-ui;background:#0b1729;color:#eaf4ff;padding:18px}main{max-width:880px;margin:auto}textarea{width:100%;height:115px;background:#172b46;color:white;padding:12px;box-sizing:border-box;font:inherit}button{padding:12px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172b46;padding:15px}a{color:#9cefff}</style><main><h1>Universal Mission Modeling · V631.3.5</h1><p>Choose a supported model by describing a robot, projectile, spring, or pendulum. Calculations use simplified physics and are not autonomous AI.</p><textarea id="mission">Simulate a robot mass 10 kg force 20 N duration 10 seconds target 100 meters friction 0.05</textarea><p><button id="run">Simulate mission</button><button id="opt">Optimize force &amp; mass</button><button id="save">Export JSON</button></p><pre id="out">Ready.</pre><p><a href="MISSION_REASONING_V631_3_4.html">Previous Mission Reasoning</a> · <a href="index.html">Home</a></p></main><script src="mission_reasoning_v631_3_4.js"></script><script src="mission_universal_v631_3_5.js"></script><script>let latest;const output=document.getElementById('out'),input=document.getElementById('mission');function go(fn){try{latest=fn(input.value);output.textContent=JSON.stringify(latest,null,2)}catch(e){output.textContent='Error: '+e.message}}document.getElementById('run').onclick=()=>go(CASUniversalMission305.simulate);document.getElementById('opt').onclick=()=>go(CASUniversalMission305.optimize);document.getElementById('save').onclick=()=>{if(!latest)return;let u=URL.createObjectURL(new Blob([JSON.stringify(latest,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='mission_v631_3_5.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script></html>
