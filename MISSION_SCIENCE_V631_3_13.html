<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.13 Adaptive Science</title><style>body{background:#101c2b;color:#f2f6fd;font:16px system-ui;margin:0;padding:20px}main{max-width:960px;margin:auto}textarea,input{width:100%;box-sizing:border-box;background:#20374e;color:white;border:1px solid #8ba7c0;border-radius:7px;padding:12px;font:inherit}textarea{height:125px}button{padding:12px;margin:6px 6px 6px 0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2e43;padding:16px}a{color:#a7dcff}</style><main><h1>Adaptive Scientific Mission Lab · V631.3.13</h1><p>Offline experiment sweeps and parameter uncertainty for supported robotics and propulsion models. Results are illustrative, not validated mission predictions.</p><label for="desc">Describe your mission</label><textarea id="desc">Simulate a robotic vehicle with mass 10 force 20 duration 10 target distance 100 maximum speed 30</textarea><p><button id="build">Design</button><button id="run">Simulate</button><button id="opt">Optimize</button><button id="exp">Run experiment</button><button id="unc">Uncertainty ±5%</button><button id="save">Export report</button></p><pre id="out" aria-live="polite">Ready.</pre><a href="MISSION_DESIGNER_V631_3_12.html">Previous Mission Designer</a></main><script src="mission_engineering_v631_3_10.js"></script><script src="mission_intelligence_v631_3_11.js"></script><script src="mission_designer_v631_3_12.js"></script><script src="mission_science_v631_3_13.js"></script><script>const api=CASMissionScience313,desc=document.getElementById('desc'),out=document.getElementById('out');let report;function show(x){report=x;out.textContent=JSON.stringify(x,null,2)}function act(fn){try{show(fn())}catch(e){out.textContent='Error: '+e.message}}document.getElementById('build').onclick=()=>act(()=>api.design(desc.value));document.getElementById('run').onclick=()=>act(()=>api.evaluate(api.design(desc.value)));document.getElementById('opt').onclick=()=>act(()=>api.optimize(api.design(desc.value)));document.getElementById('exp').onclick=()=>act(()=>api.experiment(desc.value));document.getElementById('unc').onclick=()=>act(()=>api.uncertainty(desc.value));document.getElementById('save').onclick=()=>{if(!report)return;const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mission_science_v631_3_13.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
