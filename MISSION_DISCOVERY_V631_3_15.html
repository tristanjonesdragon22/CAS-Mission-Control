<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.15 Universal Mission Discovery</title><style>body{background:#101b2a;color:#f2f6ff;font:16px system-ui;margin:0;padding:20px}main{max-width:1000px;margin:auto}textarea{width:100%;box-sizing:border-box;background:#21384f;color:white;border:1px solid #89a9c8;border-radius:8px;padding:12px;font:inherit;min-height:120px}button{padding:12px;margin:5px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c3045;padding:16px}a{color:#a8dbff}</style><main><h1>Universal Mission Discovery · V631.3.15</h1><p>Offline mission model inspection, simulation, adaptive search and deterministic sensitivity experiments. Simplified models only.</p><label for="desc">Describe a supported mission</label><textarea id="desc">Simulate a robotic vehicle with mass 10 force 20 duration 10 target distance 100 maximum speed 30</textarea><p><button id="plan">Inspect model</button><button id="run">Simulate</button><button id="opt">Optimize</button><button id="investigate">Investigate uncertainty</button><button id="export">Export JSON</button></p><pre id="out" aria-live="polite">Ready.</pre><a href="MISSION_ENGINEERING_V631_3_14.html">Previous engineering lab</a></main><script src="mission_engineering_v631_3_10.js"></script><script src="mission_intelligence_v631_3_11.js"></script><script src="mission_designer_v631_3_12.js"></script><script src="mission_science_v631_3_13.js"></script><script src="mission_engineering_v631_3_14.js"></script><script src="mission_discovery_v631_3_15.js"></script><script>const api=CASMissionDiscovery315,d=document.getElementById('desc'),out=document.getElementById('out');let last=null;function act(f){try{last=f();out.textContent=JSON.stringify(last,null,2)}catch(e){out.textContent='Error: '+e.message}}document.getElementById('plan').onclick=()=>act(()=>api.plan(d.value));document.getElementById('run').onclick=()=>act(()=>api.execute(d.value));document.getElementById('opt').onclick=()=>act(()=>api.optimize(d.value));document.getElementById('investigate').onclick=()=>act(()=>api.investigate(d.value));document.getElementById('export').onclick=()=>{if(!last)return;const blob=new Blob([JSON.stringify(last,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mission_discovery_v631_3_15.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
