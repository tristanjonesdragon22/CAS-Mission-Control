<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>CAS V631.3.1 Mission Model Studio</title><style>body{background:#0b1324;color:#e9f4ff;font:16px system-ui;margin:0;padding:20px}main{max-width:800px;margin:auto}textarea,input,button{font:inherit;padding:10px;border-radius:8px;margin:5px;background:#17243a;color:white;border:1px solid #607a9b}textarea{width:95%;height:100px}button{background:#60dbe3;color:#071728;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin-top:10px}</style><main><h1>Mission Mathematical Model Studio · V631.3.1</h1><p>Define a mathematical equation, set parameters and simulate its values offline. Review assumptions before using results.</p><label>Mission description</label><textarea id="desc">Study constant acceleration; equation: 0.5*a*t^2; a=2</textarea><label>Independent variable</label><input id="variable" value="t"><label>Start / End / Step</label><input id="start" type="number" value="0"><input id="end" type="number" value="10"><input id="step" type="number" value="1" min="0.00001"><p><button id="run">Run model</button><button id="export">Export JSON</button></p><pre id="output" role="status">Ready.</pre><p><a href="index.html" style="color:#8eeaff">Back to CAS workspace</a></p></main><script src="mission_model_studio_v631_3_1.js"></script><script>let last=null;document.getElementById('run').onclick=()=>{try{let spec=CASMission301.parse(document.getElementById('desc').value);Object.assign(spec,{variable:document.getElementById('variable').value,start:Number(document.getElementById('start').value),end:Number(document.getElementById('end').value),step:Number(document.getElementById('step').value)});last=CASMission301.run(spec);document.getElementById('output').textContent=JSON.stringify(last,null,2)}catch(e){document.getElementById('output').textContent='Error: '+e.message}};document.getElementById('export').onclick=()=>{if(!last)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));a.download='mission_model_results.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
