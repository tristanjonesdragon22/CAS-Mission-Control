<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.35 — 3D Physics</title><style>body{font:16px system-ui;background:#101827;color:#f1f5f9;margin:0;padding:20px}main{max-width:960px;margin:auto}textarea,input,select,button{font:inherit;padding:10px;border-radius:8px}textarea{width:100%;box-sizing:border-box;background:#1e293b;color:white}button{margin:6px 4px;background:#3b82f6;color:white;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e293b;padding:12px;border-radius:8px}canvas{max-width:100%;background:#fff;border-radius:8px}</style></head><body><main><h1>3D Physics & Mission Engineering — V631.3.35</h1><p>Offline numerical RK4 simulations. Enter JSON options for a robot or orbital model. Distances are in meters and time in seconds.</p><select id="kind"><option value="robot">3D robotic motion</option><option value="orbit">3D orbital motion</option></select><textarea id="options" rows="8">{"mass_kg":10,"force_N":[20,5,0],"duration_s":10,"steps":200}</textarea><div><button id="run">Simulate</button><button id="verify">Convergence check</button><button id="export">Export JSON</button></div><canvas id="plot" width="850" height="380" aria-label="XY projected trajectory"></canvas><pre id="output">Ready.</pre><p>Plots are XY projections of 3D results; Z coordinates are available in the exported data. Idealized models only.</p></main><script src="physics_3d_v631_3_35.js"></script><script>
let result=null;const el=id=>document.getElementById(id);function plot(points){const c=el('plot'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);let xs=points.map(p=>p.position_m[0]),ys=points.map(p=>p.position_m[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),dx=maxx-minx||1,dy=maxy-miny||1;ctx.strokeStyle='#155e75';ctx.lineWidth=2;ctx.beginPath();points.forEach((p,i)=>{let x=25+(p.position_m[0]-minx)/dx*(c.width-50),y=c.height-25-(p.position_m[1]-miny)/dy*(c.height-50);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function act(verify){try{const kind=el('kind').value,opts=JSON.parse(el('options').value);result=verify?CASPhysics335.convergence(kind,opts):CASPhysics335[kind](opts);if(!verify)plot(result.history);el('output').textContent=JSON.stringify(verify?result:{model:result.model,final:result.final,diagnostics:result.diagnostics,assumptions:result.assumptions,history_points:result.history.length},null,2)}catch(e){el('output').textContent='Error: '+e.message}}
el('kind').onchange=()=>{el('options').value=el('kind').value==='robot'?'{"mass_kg":10,"force_N":[20,5,0],"duration_s":10,"steps":200}':'{"body":"earth","altitude_m":400000,"duration_s":5400,"steps":400}'};el('run').onclick=()=>act(false);el('verify').onclick=()=>act(true);el('export').onclick=()=>{if(!result)return;let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));a.href=url;a.download='cas_3d_physics_report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
