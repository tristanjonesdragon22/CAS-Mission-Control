<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.4 Mission Reasoning</title><style>body{font:16px system-ui;background:#0b1729;color:#eaf4ff;padding:20px}main{max-width:850px;margin:auto}textarea{width:100%;height:120px;background:#172b46;color:white;font:inherit;padding:12px;box-sizing:border-box}button{padding:12px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172b46;padding:16px}a{color:#9cefff}</style><main><h1>Mission Reasoning · V631.3.4</h1><p>Describe a constant-force robot or vehicle mission. Review generated connected equations and assumptions. This is a bounded rule-based model, not general-purpose AI.</p><textarea id="mission">Simulate a robot mass 10 kg force 20 N duration 10 seconds target 100 meters</textarea><p><button id="run">Build and simulate</button><button id="opt">Compare force strategies</button><button id="save">Export result</button></p><pre id="out">Ready.</pre><p><a href="MISSION_MODEL_GRAPH_V631_3_3.html">Model Graph</a> · <a href="index.html">Home</a></p></main><script src="mission_reasoning_v631_3_4.js"></script><script>let latest=null;const out=document.getElementById('out'),input=document.getElementById('mission');function go(fn){try{latest=fn(input.value);out.textContent=JSON.stringify(latest,null,2)}catch(e){out.textContent='Error: '+e.message}}document.getElementById('run').onclick=()=>go(CASMissionReasoning304.run);document.getElementById('opt').onclick=()=>go(CASMissionReasoning304.optimize);document.getElementById('save').onclick=()=>{if(!latest)return;let url=URL.createObjectURL(new Blob([JSON.stringify(latest,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='mission_v631_3_4.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
