<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.30 Mission Research Planner</title><style>body{font:16px system-ui;background:#0c1424;color:#e8eef9;max-width:920px;margin:auto;padding:18px}textarea,input,select,button{box-sizing:border-box;background:#1a2a42;color:white;border:1px solid #526d91;border-radius:8px;padding:10px;margin:5px 0}textarea{width:100%;height:100px}input{width:125px}button{cursor:pointer;background:#235f9b}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#15233b;padding:16px;border-radius:10px}canvas{width:100%;max-width:850px;background:white;border-radius:8px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}label{display:flex;flex-direction:column;font-size:13px}</style></head><body><h1>Universal Scientific Mission Planner</h1><p>CAS V631.3.30 — offline, deterministic experiments with simplified physics.</p><h2>Interpret mission description</h2><textarea id="description">Design a robotic vehicle weighing 10 kilograms applying 20 newtons force for 10 seconds.</textarea><button id="interpret">Inspect mission</button><h2>Physics research</h2><div class="row"><label>Physics<select id="kind"><option value="robot">Robot (1D)</option><option value="orbit">Orbit (2D)</option></select></label><label>Experiment parameter<select id="field"></select></label><label>Low<input id="low" type="number" value="10"></label><label>High<input id="high" type="number" value="30"></label><label>Trials<input id="count" type="number" value="9" min="2" max="101"></label><label>Metric<select id="metric"></select></label></div><p>Baseline parameters (JSON, SI units)</p><textarea id="params">{"mass_kg":10,"force_N":20,"duration_s":10,"steps":200}</textarea><div><button id="simulate">Simulate</button><button id="study">Research &amp; verify</button><button id="export">Export report</button></div><canvas id="plot" width="850" height="300" aria-label="Experimental result plot"></canvas><pre id="output">Ready.</pre><script src="unified_math_core_v631_3_27.js"></script><script src="model_builder_v631_3_28.js"></script><script src="physics_engine_v631_3_29.js"></script><script src="research_planner_v631_3_30.js"></script><script>
const $=id=>document.getElementById(id);let last=null;const configs={robot:{fields:['force_N','mass_kg','force_rate_N_s','linear_drag_N_per_m_s'],metrics:['position_m','velocity_m_s'],defaults:{mass_kg:10,force_N:20,duration_s:10,steps:200}},orbit:{fields:['altitude_m','initial_speed_m_s'],metrics:['altitude_m','speed_m_s','energy_drift'],defaults:{body:'earth',altitude_m:400000,duration_s:5400,steps:600}}};function setup(){const k=$('kind').value,c=configs[k];$('params').value=JSON.stringify(c.defaults,null,2);$('field').innerHTML=c.fields.map(x=>'<option>'+x+'</option>').join('');$('metric').innerHTML=c.metrics.map(x=>'<option>'+x+'</option>').join('');$('low').value=k==='robot'?10:300000;$('high').value=k==='robot'?30:500000;}function show(x){last=x;$('output').textContent=JSON.stringify(x,null,2).slice(0,50000)}function safe(fn){try{fn()}catch(e){$('output').textContent='Error: '+e.message}}function draw(trials){const c=$('plot'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.fillStyle='white';g.fillRect(0,0,c.width,c.height);const good=trials.filter(t=>t.error===null);if(!good.length)return;let a=Math.min(...good.map(t=>t.score)),b=Math.max(...good.map(t=>t.score));if(a===b){a-=1;b+=1}g.strokeStyle='#1d4f9a';g.lineWidth=2;g.beginPath();good.forEach((t,i)=>{const x=40+770*i/Math.max(1,good.length-1),y=260-220*(t.score-a)/(b-a);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle='#222';g.font='15px sans-serif';g.fillText('Metric range: '+a.toPrecision(5)+' to '+b.toPrecision(5),40,25)}$('kind').onchange=setup;$('interpret').onclick=()=>safe(()=>show(CASResearchPlanner330.plan($('description').value)));$('simulate').onclick=()=>safe(()=>show(CASResearchPlanner330.run($('kind').value,JSON.parse($('params').value))));$('study').onclick=()=>safe(()=>{const p=JSON.parse($('params').value),field=$('field').value;if(!(field in p))throw Error('Add '+field+' to baseline JSON before varying it');const result=CASResearchPlanner330.research($('kind').value,p,field,Number($('low').value),Number($('high').value),Number($('count').value),$('metric').value);show(result);draw(result.investigation.trials)});$('export').onclick=()=>safe(()=>{if(!last)throw Error('Run an investigation first');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));a.download='cas_mission_research_v631_3_30.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});setup();</script></body></html>
