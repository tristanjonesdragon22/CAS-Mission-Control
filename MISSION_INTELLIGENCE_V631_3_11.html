<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.11 Mission Director</title><style>body{background:#101c2b;color:#f2f6fd;font:16px system-ui;margin:0;padding:20px}main{max-width:980px;margin:auto}textarea,input,select{box-sizing:border-box;background:#20374e;color:white;border:1px solid #8ba7c0;border-radius:7px;padding:10px;font:inherit}textarea{width:100%;height:130px}button{padding:12px;margin:5px;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2e43;padding:16px;border-radius:8px}a{color:#a7dcff}label{display:block;margin-top:14px}</style><main><h1>Universal Mission Director · V631.3.11</h1><p>Describe a supported mission, inspect the mathematical model, run it, and compare two parameters. Works offline. Rule-based interpretation is not general-purpose AI.</p><label for="description">Mission description</label><textarea id="description">Simulate a robotic vehicle with mass 10, force 20, duration 10, friction coefficient 0.05</textarea><p><button id="build">Build model</button><button id="run">Run model</button><button id="opt">Optimize mass and force</button><button id="export">Export report</button></p><label for="mission">Editable mathematical mission (JSON)</label><textarea id="mission" style="height:200px"></textarea><pre id="output" aria-live="polite">Ready. Build a model first.</pre><p><a href="MISSION_ENGINEERING_V631_3_10.html">Previous engineering workspace</a> · <a href="index.html">Home</a></p></main><script src="mission_engineering_v631_3_10.js"></script><script src="mission_intelligence_v631_3_11.js"></script><script>const api=CASMissionIntelligence311,out=document.getElementById('output'),box=document.getElementById('mission');let report=null;function display(x){report=x;out.textContent=JSON.stringify(x,null,2)}function guarded(fn){try{display(fn())}catch(e){out.textContent='Error: '+e.message}}document.getElementById('build').onclick=()=>guarded(()=>{const m=api.interpret(document.getElementById('description').value);box.value=JSON.stringify(m,null,2);return m});document.getElementById('run').onclick=()=>guarded(()=>api.run(JSON.parse(box.value)));document.getElementById('opt').onclick=()=>guarded(()=>{const m=JSON.parse(box.value),t=m.stages[0].type;if(t==='robot')return api.experiment(m,{metric:'distance_m',target:100,variables:[{name:'mass_kg',min:5,max:20,steps:21},{name:'force_N',min:5,max:50,steps:21}]});return api.experiment(m,{metric:'delta_v_m_s',target:1000,variables:[{name:'fuel_mass_kg',min:10,max:500,steps:21},{name:'isp_s',min:200,max:500,steps:21}]})});document.getElementById('export').onclick=()=>{if(!report)return;const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='mission_v631_3_11.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('build').click();</script></html>
