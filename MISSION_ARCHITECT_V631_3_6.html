<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.6 Mission Architect</title><style>body{background:#0b1729;color:#eaf4ff;font:16px system-ui;padding:16px}main{max-width:940px;margin:auto}textarea,input,select{background:#172b46;color:white;border:1px solid #4d718d;padding:10px;font:inherit;box-sizing:border-box}textarea{width:100%;height:110px}button{padding:12px;margin:8px 8px 8px 0}pre{background:#172b46;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}label{display:inline-block;margin:8px}a{color:#9cefff}</style><main><h1>Mission Architect · V631.3.6</h1><p>Build a mathematical mission plan, simulate it, compare selected parameters, and inspect sensitivity. Offline and rule-based; not autonomous AI.</p><textarea id="mission">Simulate a robot mass 10 kg force 20 N duration 10 seconds target 100 meters friction 0.05</textarea><p><button id="plan">Build plan</button><button id="run">Execute simulation</button><button id="sensitivity">Sensitivity</button><button id="sweep">Compare trials</button><button id="export">Export JSON</button></p><label>Parameter <input id="parameter" value="force"></label><label>Trial values (comma-separated) <input id="values" value="10,15,20,25,30"></label><label>Metric <input id="metric" value="distance_m"></label><label>Goal <select id="goal"><option>max</option><option>min</option></select></label><pre id="output">Ready.</pre><p><a href="MISSION_UNIVERSAL_V631_3_5.html">Previous modeler</a> · <a href="index.html">Home</a></p></main><script src="mission_reasoning_v631_3_4.js"></script><script src="mission_universal_v631_3_5.js"></script><script src="mission_architect_v631_3_6.js"></script><script>let last;const v=id=>document.getElementById(id).value;function run(fn){try{last=fn();document.getElementById('output').textContent=JSON.stringify(last,null,2)}catch(e){document.getElementById('output').textContent='Error: '+e.message}}document.getElementById('plan').onclick=()=>run(()=>CASMissionArchitect306.architecture(v('mission')));document.getElementById('run').onclick=()=>run(()=>CASMissionArchitect306.simulate(v('mission')));document.getElementById('sensitivity').onclick=()=>run(()=>CASMissionArchitect306.sensitivity(v('mission'),v('parameter')));document.getElementById('sweep').onclick=()=>run(()=>CASMissionArchitect306.sweep(v('mission'),v('parameter'),v('values').split(',').map(Number),v('metric'),v('goal')));document.getElementById('export').onclick=()=>{if(!last)return;const u=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='mission_v631_3_6.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script></html>
