<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.9 Integrated Mission Control</title><style>body{background:#101b2c;color:#edf3fa;font:16px system-ui;margin:0;padding:18px}main{max-width:940px;margin:auto}textarea,input{background:#20344c;color:white;border:1px solid #91a9c4;border-radius:6px;padding:9px;font:inherit}textarea{width:100%;box-sizing:border-box;height:95px}label{display:inline-flex;flex-direction:column;margin:6px;gap:4px}button{padding:12px;margin:5px;border-radius:7px}pre{background:#1c2d43;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a4d9ff}</style><main><h1>Integrated Mission Control · V631.3.9</h1><p>Connected model planning, constrained simulation, and multi-variable grid optimization. Offline; predefined models only.</p><textarea id="desc">Simulate a robot mass 10 kg force 20 N duration 10 seconds friction 0.05</textarea><p><button id="plan">Build Plan</button><button id="run">Run Mission</button><button id="opt">Optimize</button><button id="save">Export JSON</button></p><label>Variable 1<input id="v1" value="force"></label><label>Min 1<input id="lo1" type="number" value="5"></label><label>Max 1<input id="hi1" type="number" value="40"></label><br><label>Variable 2 (optional)<input id="v2" value="mass"></label><label>Min 2<input id="lo2" type="number" value="8"></label><label>Max 2<input id="hi2" type="number" value="15"></label><br><label>Metric<input id="metric" value="distance_m"></label><label>Target<input id="target" type="number" value="100"></label><label>Samples per variable (3–11)<input id="samples" type="number" value="7" min="3" max="11"></label><br><label>Constraint metric (optional)<input id="constraint" value="velocity_m_s"></label><label>Maximum<input id="maxconstraint" type="number" value="30"></label><pre id="out" aria-live="polite">Ready.</pre><p><a href="MISSION_ADAPTIVE_V631_3_8.html">Previous mission workspace</a> · <a href="index.html">Home</a></p></main><script src="mission_reasoning_v631_3_4.js"></script><script src="mission_universal_v631_3_5.js"></script><script src="mission_architect_v631_3_6.js"></script><script src="mission_engineering_v631_3_7.js"></script><script src="mission_adaptive_v631_3_8.js"></script><script src="mission_integrated_v631_3_9.js"></script><script>let last;const e=id=>document.getElementById(id),d=()=>e('desc').value;function show(fn){try{last=fn();e('out').textContent=JSON.stringify(last,null,2)}catch(err){e('out').textContent='Error: '+err.message}}function constraints(){return e('constraint').value.trim()?{[e('constraint').value.trim()]:{max:Number(e('maxconstraint').value)}}:{}}e('plan').onclick=()=>show(()=>CASIntegratedMission309.plan(d()));e('run').onclick=()=>show(()=>CASIntegratedMission309.execute(d(),{constraints:constraints()}));e('opt').onclick=()=>show(()=>{const variables=[{name:e('v1').value.trim(),min:Number(e('lo1').value),max:Number(e('hi1').value)}];if(e('v2').value.trim())variables.push({name:e('v2').value.trim(),min:Number(e('lo2').value),max:Number(e('hi2').value)});return CASIntegratedMission309.optimize(d(),{variables,metric:e('metric').value.trim(),target:Number(e('target').value),samples:Number(e('samples').value),constraints:constraints()})});e('save').onclick=()=>{if(!last)return;const url=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='mission_v631_3_9.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
