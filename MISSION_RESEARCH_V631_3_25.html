<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS Mission Research V631.3.25</title><style>body{font:16px system-ui;background:#101b2c;color:#f2f6ff;max-width:900px;margin:auto;padding:18px}textarea,input,select,button{box-sizing:border-box;width:100%;padding:10px;margin:6px 0;background:#203650;color:white;border:1px solid #8296b6;border-radius:8px}button{background:#2560a9}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2d46;padding:14px;max-height:500px;overflow:auto}small{color:#ccd8e9}</style></head><body><h1>Mission Research Intelligence · V631.3.25</h1><p>Offline model inspection, bounded optimization, scenario analysis, and locally stored research history.</p><label>Mission JSON<textarea id="mission" rows="6">{"stages":[{"type":"robot","mass_kg":10,"force_N":20,"duration_s":10,"friction_coefficient":0},{"type":"robot","mass_kg":10,"force_N":20,"duration_s":10,"friction_coefficient":0}]}</textarea></label><label>Controls JSON<textarea id="controls" rows="4">[{"stage":0,"parameter":"force_N","min":10,"max":30},{"stage":1,"parameter":"force_N","min":10,"max":30}]</textarea></label><label>Metric<select id="metric"><option>distance_m</option><option>velocity_m_s</option><option>delta_v_m_s</option><option>kinetic_energy_J</option></select></label><label>Target (optional)<input id="target" type="number" placeholder="Maximize when empty"></label><label>Grid steps per control (2–11)<input id="steps" type="number" min="2" max="11" value="5"></label><label>Scenario variation (0–0.5)<input id="variation" type="number" min="0.001" max="0.5" step="0.01" value="0.1"></label><button id="model">Inspect connected model</button><button id="suggest">Suggest controls from history</button><button id="scenarios">Analyze scenarios</button><button id="investigate">Optimize + analyze uncertainty</button><button id="save">Save last research locally</button><button id="export">Export last result JSON</button><pre id="output">Ready.</pre><small>Predefined idealized physics only. This is not an unrestricted AI scientist, independently verified engineering system, or signed iPad app.</small><script src="mission_engineering_v631_3_10.js"></script><script src="mission_discovery_v631_3_20.js"></script><script src="mission_lab_v631_3_21.js"></script><script src="mission_intelligence_v631_3_22.js"></script><script src="mission_discovery_v631_3_23.js"></script><script src="mission_intelligence_v631_3_24.js"></script><script src="mission_research_v631_3_25.js"></script><script>
const el=id=>document.getElementById(id);let last=null;const mission=()=>JSON.parse(el('mission').value),controls=()=>JSON.parse(el('controls').value),opts=()=>({metric:el('metric').value,steps:Number(el('steps').value),variation:Number(el('variation').value),...(el('target').value!==''?{target:Number(el('target').value)}:{})});function show(x){last=x;el('output').textContent=JSON.stringify(x,null,2)}function safe(fn){try{fn()}catch(e){el('output').textContent='Error: '+e.message}}const key='cas_mission_research_325';const records=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return []}};el('model').onclick=()=>safe(()=>show(CASMissionResearch325.model(mission())));el('suggest').onclick=()=>safe(()=>{const r=CASMissionResearch325.recommend(mission(),records(),el('metric').value);el('controls').value=JSON.stringify(r.controls,null,2);show(r)});el('scenarios').onclick=()=>safe(()=>show(CASMissionResearch325.scenarios(mission(),controls(),opts())));el('investigate').onclick=()=>safe(()=>show(CASMissionResearch325.investigate(mission(),controls(),opts())));el('save').onclick=()=>safe(()=>{if(!last)throw Error('Run a study first');const a=records();a.push({controls:controls(),metric:el('metric').value,date:new Date().toISOString(),summary:last.version});localStorage.setItem(key,JSON.stringify(a.slice(-50)));el('output').textContent='Saved research record '+Math.min(a.length,50)});el('export').onclick=()=>safe(()=>{if(!last)throw Error('Run a study first');const u=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='mission_research_325.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)});
</script></body></html>
