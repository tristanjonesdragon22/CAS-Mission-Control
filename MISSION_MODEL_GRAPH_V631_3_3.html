<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.3 Model Graph</title><style>body{background:#101b2e;color:#edf5ff;font:16px system-ui;padding:18px}main{max-width:950px;margin:auto}textarea{width:100%;height:340px;box-sizing:border-box;background:#192c47;color:#fff;padding:12px}button{padding:12px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#192c47;padding:15px}a{color:#9deaff}</style><main><h1>Mission Model Graph · V631.3.3</h1><p>Review and edit a connected equation workflow in JSON. Calculations are offline and dimension-checked. This is not unrestricted English-to-equation generation.</p><textarea id="model" aria-label="Mission model JSON"></textarea><p><button id="run">Validate and simulate</button><button id="compare">Compare force strategies</button><button id="save">Export JSON</button></p><pre id="output" role="status">Ready.</pre><p><a href="MISSION_DESIGNER_V631_3_2.html">Mission Designer</a> · <a href="index.html">Home</a></p></main><script src="mission_graph_v631_3_3.js"></script><script>const area=document.getElementById('model'),out=document.getElementById('output');area.value=JSON.stringify(CASMissionGraph303.example,null,2);document.getElementById('run').onclick=()=>{try{out.textContent=JSON.stringify(CASMissionGraph303.run(JSON.parse(area.value)),null,2)}catch(e){out.textContent='Error: '+e.message}};document.getElementById('compare').onclick=()=>{try{out.textContent=JSON.stringify(CASMissionGraph303.optimize(JSON.parse(area.value),'force',[10,15,20,25,30],'distance',100),null,2)}catch(e){out.textContent='Error: '+e.message}};document.getElementById('save').onclick=()=>{let b=new Blob([area.value],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mission_model_v631_3_3.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
