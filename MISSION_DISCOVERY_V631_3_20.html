<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Discovery V631.3.20</title><style>body{font:16px system-ui;background:#101b2c;color:#f0f5ff;max-width:920px;margin:auto;padding:18px}textarea,input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0 12px;background:#20334d;color:white;border:1px solid #7789a8;border-radius:8px}button{background:#245ba6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2d46;padding:15px}label{display:block}svg{background:#f6f8fb;width:100%;height:200px}</style><h1>Universal Mission Discovery · V631.3.20</h1><p>Offline, simplified mathematical research. Describe a robot or rocket, review the generated JSON, then optimize bounded stage parameters.</p><label>Mission description<textarea id="description" rows="3">A 10 kg robot with 20 newtons force for 10 seconds in 2 stages</textarea></label><button id="interpret">Interpret description</button><label>Mission JSON<textarea id="mission" rows="9">{"stages":[{"type":"robot","mass_kg":10,"force_N":20,"duration_s":10,"friction_coefficient":0},{"type":"robot","mass_kg":10,"force_N":20,"duration_s":10,"friction_coefficient":0}]}</textarea></label><label>Stage controls JSON (0-based stages)<textarea id="controls" rows="4">[{"stage":0,"parameter":"force_N","min":1,"max":40},{"stage":1,"parameter":"force_N","min":1,"max":40}]</textarea></label><label>Metric<input id="metric" value="distance_m"></label><label>Target (blank to maximize)<input id="target" type="number" value="300"></label><button id="simulate">Simulate</button><button id="optimize">Optimize mission</button><button id="hypothesis">Test first control hypothesis</button><button id="export">Export JSON report</button><svg id="chart" role="img" aria-label="Stage trajectory chart" viewBox="0 0 600 200"></svg><pre id="output">Ready.</pre><script src="mission_engineering_v631_3_10.js"></script><script src="mission_discovery_v631_3_20.js"></script><script>let last=null;const el=id=>document.getElementById(id),show=x=>{last=x;el('output').textContent=JSON.stringify(x,null,2)},mission=()=>JSON.parse(el('mission').value),controls=()=>JSON.parse(el('controls').value),opts=()=>({controls:controls(),metric:el('metric').value,...(el('target').value===''?{}:{target:Number(el('target').value)})});function safe(f){try{f()}catch(e){el('output').textContent='Error: '+e.message}}function chart(history){const svg=el('chart');svg.replaceChildren();if(!history||!history.length)return;const vals=history.map(h=>h.distance_m??h.delta_v_m_s??0);const max=Math.max(1,...vals.map(Math.abs));const points=vals.map((v,i)=>`${20+i*560/Math.max(1,vals.length-1)},${180-160*v/max}`).join(' ');const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',points);line.setAttribute('fill','none');line.setAttribute('stroke','#1762b0');line.setAttribute('stroke-width','3');svg.appendChild(line)}el('interpret').onclick=()=>safe(()=>{const result=CASMissionDiscovery320.parse(el('description').value);el('mission').value=JSON.stringify(result.mission,null,2);show(result)});el('simulate').onclick=()=>safe(()=>{const r=CASMissionEngineering310.run(mission());show(r);chart(r.history.map(h=>({...h.state,stage:h.stage})))});el('optimize').onclick=()=>safe(()=>{const r=CASMissionDiscovery320.optimize(mission(),opts());show(r);chart(r.trajectory)});el('hypothesis').onclick=()=>safe(()=>show(CASMissionDiscovery320.hypothesis(mission(),controls()[0],el('metric').value)));el('export').onclick=()=>safe(()=>{if(!last)throw Error('Run a study first');const u=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='mission_discovery_320.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});</script></html>
