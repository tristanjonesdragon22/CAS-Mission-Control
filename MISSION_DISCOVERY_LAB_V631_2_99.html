<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS Mission Discovery Lab V631.2.99</title><style>body{font:16px system-ui;background:#101b2a;color:#edf3ff;margin:0 auto;padding:20px;max-width:950px}textarea{width:100%;box-sizing:border-box;min-height:100px;background:#203149;color:white;padding:12px}button{padding:12px;margin:6px;background:#7bd8cc;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2a40;padding:15px}a{color:#7bd8cc}</style><h1>Integrated Mission Discovery Lab · V631.2.99</h1><p>Offline, rule-based scientific workflow, model inspection, candidate comparisons and evidence checks.</p><textarea id="mission">Investigate a robot traveling 100 meters by comparing force and mass</textarea><p><button id="run">Run research workflow</button><button id="save">Save results</button><button id="history">History</button><button id="export">Export JSON</button></p><p><a href="index.html">Main CAS</a> · <a href="MISSION_RESEARCH_V631_2_98.html">Previous research lab</a></p><pre id="output">Ready.</pre><script src="mission_workflow_v631_2_92.js"></script><script src="mission_research_v631_2_93.js"></script><script src="mission_scientific_intelligence_v631_2_94.js"></script><script src="mission_adaptive_discovery_v631_2_95.js"></script><script src="mission_research_planner_v631_2_96.js"></script><script src="mission_reasoning_v631_2_97.js"></script><script src="mission_scientific_reasoning_v631_2_98.js"></script><script src="mission_discovery_lab_v631_2_99.js"></script><script>let last=null;const el=id=>document.getElementById(id);const show=x=>el('output').textContent=JSON.stringify(x,null,2);el('run').onclick=()=>{try{last=CASMission99.workflow(el('mission').value);show(last)}catch(e){show({error:e.message})}};el('save').onclick=()=>{try{if(!last)throw Error('Run workflow first');show({saved:CASMission99.save(last)})}catch(e){show({error:e.message})}};el('history').onclick=()=>show(CASMission99.load());el('export').onclick=()=>{if(!last)return show({error:'Run workflow first'});const u=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='cas_mission_v99.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}</script></html>
