<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.2 Intelligent Mission Designer</title><style>body{background:#0b1324;color:#edf6ff;font:16px system-ui;padding:20px}main{max-width:850px;margin:auto}textarea,button{font:inherit;border-radius:9px;padding:12px}textarea{box-sizing:border-box;width:100%;height:120px;background:#17243a;color:white;border:1px solid #7186a0}button{background:#64dce6;border:0;margin:8px 5px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#17243a;padding:18px;border-radius:12px}a{color:#9fe9ff}</style><main><h1>Intelligent Mission Designer · V631.3.2</h1><p>Describe a supported physical mission. Review the proposed equation, parameters, units and assumptions before simulating. Unsupported descriptions are flagged.</p><textarea id="desc">Simulate a robot accelerating with a=2</textarea><p><button id="design">Design mathematical model</button><button id="simulate">Simulate approved model</button><button id="export">Export model JSON</button></p><pre id="out" role="status">Ready.</pre><p><a href="MISSION_MODEL_STUDIO_V631_3_1.html">Custom equation studio</a> · <a href="index.html">CAS home</a></p></main><script src="mission_designer_v631_3_2.js"></script><script src="mission_model_studio_v631_3_1.js"></script><script>let current=null;document.getElementById('design').onclick=()=>{try{current=CASMissionDesigner302.design(document.getElementById('desc').value);document.getElementById('out').textContent=JSON.stringify({...current,dimensionsReview:CASMissionDesigner302.dimensionalCheck(current)},null,2)}catch(e){current=null;document.getElementById('out').textContent='Error: '+e.message}};document.getElementById('simulate').onclick=()=>{try{if(!current||current.status!=='template_match')throw Error('Select a supported model first');let result=CASMission301.run({...current,start:0,end:10,step:1});document.getElementById('out').textContent=JSON.stringify({model:current,result},null,2)}catch(e){document.getElementById('out').textContent='Error: '+e.message}};document.getElementById('export').onclick=()=>{if(!current)return;let u=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='mission_design.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script></html>
