<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.45 Adaptive Mission Control</title><style>body{font:16px system-ui;background:#101b2b;color:#f2f6fc;max-width:950px;margin:auto;padding:18px}input,textarea,select,button{font:inherit;padding:10px;border-radius:7px;margin:5px 0;box-sizing:border-box}textarea{width:100%;min-height:75px}input{max-width:100%}button{background:#326cbd;color:white;border:0}pre{background:#20334c;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}a{color:#acd9ff}section{border-top:1px solid #567;padding:12px 0}label{display:block}</style></head><body><h1>CAS V631.3.45 · Adaptive Mission Control</h1><p>Offline, rule-based mission guidance and supported engineering calculations. No unrestricted AI model or physical control.</p><section><h2>Mission</h2><textarea id="description">I want to design a robotic exploration vehicle for Mars and develop it step by step.</textarea><button id="create">Create mission</button><button id="diagnose">Diagnose</button><button id="guide">Detailed guidance</button><button id="tools">Recommended tools</button><pre id="overview">Create or import a mission.</pre></section><section><h2>Conversation</h2><input id="message" placeholder="Next step, questions, status, complete step" style="width:75%"><button id="send">Send</button><pre id="conversation"></pre></section><section><h2>Run supported calculation</h2><label>Tool <select id="tool"><option value="connected-equations">Connected equations</option><option value="engineering-simulation">Engineering simulation</option></select></label><label>Equation values as JSON (example) <textarea id="values">{"m":10,"a":2,"t":10,"v0":0}</textarea></label><label>Simulation description <textarea id="simulation">A 10 kg vehicle experiences a force of 20 N for 10 seconds.</textarea></label><button id="run">Run and attach to current task</button><pre id="calculation"></pre></section><section><h2>Revise mission</h2><label>Reason <input id="reason" value="New information"></label><label>New constraints <textarea id="constraints" placeholder="Updated mission constraints"></textarea></label><button id="revise">Record revised constraints</button><button id="evaluate">Evaluate current task evidence</button></section><section><button id="export">Export project JSON</button><input id="import" type="file" accept=".json,application/json"><p><a href="ENGINEERING_LAB_V631_3_42.html">Engineering Lab</a> · <a href="ENGINEERING_DESIGN_V631_3_43.html">Engineering Design</a></p></section>
<script src="mission_director_v631_3_38.js"></script><script src="mission_planner_v631_3_39.js"></script><script src="engineering_core_v631_3_31.js"></script><script src="connected_equations_v631_3_34.js"></script><script src="mission_architect_v631_3_40.js"></script><script src="research_knowledge_v631_3_41.js"></script><script src="engineering_lab_v631_3_42.js"></script><script src="engineering_design_v631_3_43.js"></script><script src="conversational_mission_v631_3_44.js"></script><script src="adaptive_mission_v631_3_45.js"></script><script>const $=id=>document.getElementById(id),M=CASAdaptiveMission345;let p=null;function execute(f){try{if(!p)throw Error('Create or import a mission first');f();$('overview').textContent=JSON.stringify(M.diagnose(p),null,2)}catch(e){$('overview').textContent='Error: '+e.message}}$('create').onclick=()=>{try{p=M.state(CASConversationalMission344.init($('description').value));$('overview').textContent='Mission created. Ask for next step.'}catch(e){$('overview').textContent=e.message}};$('send').onclick=()=>execute(()=>{let r=M.chat(p,$('message').value);p=r.project;$('conversation').textContent+='You: '+$('message').value+'
Mission Director: '+r.reply+'

';$('message').value=''});$('message').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('send').click()}};$('diagnose').onclick=()=>execute(()=>{$('conversation').textContent=JSON.stringify(M.diagnose(p).issues,null,2)});$('guide').onclick=()=>execute(()=>{$('conversation').textContent=M.guidance(p).steps.join('
')});$('tools').onclick=()=>execute(()=>{$('conversation').textContent=JSON.stringify(M.diagnose(p).tools,null,2)});$('run').onclick=()=>execute(()=>{let tool=$('tool').value,request=tool==='connected-equations'?{tool,values:JSON.parse($('values').value)}:{tool,description:$('simulation').value};let task=M.diagnose(p).next;let r=M.calculate(p,request,task?.id);p=r.project;$('calculation').textContent=JSON.stringify(r.experiment,null,2)});$('revise').onclick=()=>execute(()=>{p=M.revise(p,$('reason').value,{constraints:$('constraints').value})});$('evaluate').onclick=()=>execute(()=>{let t=M.diagnose(p).next;if(!t)throw Error('No available task');let r=M.evaluate(p,t.id);p=r.project;$('calculation').textContent=JSON.stringify(r.result,null,2)});$('export').onclick=()=>execute(()=>{let url=URL.createObjectURL(new Blob([M.exportJSON(p)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='cas_mission_v631_3_45.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('import').onchange=async e=>{try{p=M.importJSON(await e.target.files[0].text());$('overview').textContent='Mission imported.'}catch(err){$('overview').textContent='Error: '+err.message}};</script></body></html>
