ption').value));el('execute').onclick=()=>show(()=>CASMissionEngineering307.execute(el('description').value));el('optimize').onclick=()=>show(()=>CASMissionEngineering307.optimize(el('description').value,{force_values:el('forces').value.split(',').map(Number),mass_values:el('masses').value.split(',').map(Number),target_distance_m:Number(el('target').value),max_speed_m_s:Number(el('speed').value)}));el('export').onclick=()=>{if(!last)return;const blob=new Blob([JSON.stringify(last,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mission_v631_3_7.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
