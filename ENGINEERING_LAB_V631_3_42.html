<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.42 Engineering Laboratory</title><style>body{font:16px system-ui;background:#101b2b;color:#f3f6fa;margin:auto;max-width:850px;padding:18px}textarea,input,select,button{font:inherit;border-radius:8px;padding:10px;margin:6px 0;background:#fff;color:#101b2b;box-sizing:border-box}textarea{width:100%;height:95px}button{cursor:pointer;margin-right:7px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1d3047;padding:14px;border-radius:8px}label{display:block;margin-top:12px}a{color:#a9dbff}</style></head><body><h1>CAS V631.3.42 · Engineering Laboratory</h1><p>Plan a mission, execute supported engineering calculations, attach numerical evidence to tasks, and review the results. Runs offline.</p><label>Mission description</label><textarea id="description">Design a robotic vehicle weighing 10 kilograms and accelerating for 10 seconds.</textarea><button id="create">Create mission</button><button id="guide">Next step</button><label>Experiment type</label><select id="tool"><option value="connected-equations">Connected equations</option><option value="engineering-simulation">Mission simulation</option></select><label>Equation inputs (JSON; m kg, a m/s², t seconds, v0 m/s)</label><textarea id="values">{"m":10,"a":2,"t":10,"v0":0}</textarea><label>Attach to task</label><select id="task"></select><button id="run">Run experiment</button><label>Experiment review</label><select id="exp"></select><select id="status"><option>accepted</option><option>needs-review</option><option>rejected</option></select><input id="notes" placeholder="Review notes"><button id="review">Save review</button><button id="export">Export project JSON</button><label>Import saved project JSON</label><input type="file" id="import" accept="application/json,.json"><h2>Mission output</h2><pre id="output">Create a mission to begin.</pre><p><a href="MISSION_PLANNER_V631_3_39.html">Project planner</a> · <a href="RESEARCH_KNOWLEDGE_V631_3_41.html">Knowledge library</a> · <a href="MISSION_ARCHITECT_V631_3_40.html">Mathematical architect</a></p>
<script src="mission_director_v631_3_38.js"></script><script src="mission_planner_v631_3_39.js"></script><script src="engineering_core_v631_3_31.js"></script><script src="connected_equations_v631_3_34.js"></script><script src="mission_architect_v631_3_40.js"></script><script src="research_knowledge_v631_3_41.js"></script><script src="engineering_lab_v631_3_42.js"></script><script>const $=id=>document.getElementById(id),L=CASEngineeringLab342,P=CASMissionPlanner339;let project=null;function show(x){$('output').textContent=JSON.stringify(x,null,2)}function refresh(){if(!project)return;$('task').replaceChildren(...project.tasks.map(t=>new Option(t.title,t.id)));$('exp').replaceChildren(...(project.laboratory?.experiments||[]).map(e=>new Option(e.id+' ('+e.tool+')',e.id)))}function action(f){try{f();refresh()}catch(e){show({error:e.message})}}$('create').onclick=()=>action(()=>{project=L.init(P.create($('description').value));show(L.next(project))});$('guide').onclick=()=>action(()=>show(L.next(project)));$('run').onclick=()=>action(()=>{let tool=$('tool').value,request=tool==='connected-equations'?{tool,values:JSON.parse($('values').value),taskId:$('task').value}:{tool,description:$('description').value,taskId:$('task').value};let r=L.experiment(project,request);project=r.project;show(r.experiment)});$('review').onclick=()=>action(()=>{project=L.review(project,$('exp').value,$('status').value,$('notes').value);show(L.report(project))});$('export').onclick=()=>action(()=>{let blob=new Blob([P.exportJSON(project)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mission-v631-3-42.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)});$('import').onchange=async e=>action(async()=>{try{project=L.init(P.importJSON(await e.target.files[0].text()));refresh();show(L.report(project))}catch(err){show({error:err.message})}});</script></body></html>
