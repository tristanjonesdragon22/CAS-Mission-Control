<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS V631.3.31 Unified Engineering</title><style>body{font:16px system-ui;background:#101b2b;color:#edf4ff;max-width:980px;margin:auto;padding:18px}textarea,input,select,button{background:#213550;color:white;border:1px solid #6480a3;border-radius:7px;padding:9px;margin:4px}textarea{width:96%;height:100px}button{cursor:pointer}pre{background:#17283f;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:550px;overflow:auto}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}label{display:flex;flex-direction:column;font-size:13px}h1{font-size:25px}</style></head><body><h1>Unified Mathematical Engineering Workspace</h1><p>CAS V631.3.31 — one reusable project format for supported mission models and numerical physics. Runs offline.</p><h2>1. Create project</h2><textarea id="description">Design a robotic vehicle weighing 10 kilograms applying 20 newtons force for 10 seconds.</textarea><div class="row"><button id="mission">Build mission from description</button><button id="robot">New numerical robot project</button><button id="orbit">New orbit project</button></div><h2>2. Run and inspect</h2><div class="row"><button id="inspect">Inspect equations &amp; units</button><button id="run">Simulate</button><button id="verify">Verify numerical checks</button></div><h2>3. Edit supported mission stage</h2><div class="row"><label>Stage index<input id="stage" type="number" value="0" min="0"></label><label>Field<input id="field" value="force_N"></label><label>Value<input id="value" type="number" value="25"></label><button id="edit">Compare &amp; apply</button></div><h2>4. Save and reopen project</h2><div class="row"><button id="save">Export project JSON</button><label>Import JSON<input id="import" type="file" accept="application/json,.json"></label></div><pre id="output">Create a project to begin.</pre><script src="unified_math_core_v631_3_27.js"></script><script src="model_builder_v631_3_28.js"></script><script src="physics_engine_v631_3_29.js"></script><script src="research_planner_v631_3_30.js"></script><script src="engineering_core_v631_3_31.js"></script><script>
const $=x=>document.getElementById(x),E=CASEngineering331;let project=null;function show(v){$('output').textContent=JSON.stringify(v,null,2).slice(0,70000)}function safe(fn){try{fn()}catch(e){$('output').textContent='Error: '+e.message}}$('mission').onclick=()=>safe(()=>{project=E.make($('description').value);show(project)});$('robot').onclick=()=>safe(()=>{project=E.makePhysics('robot',{mass_kg:10,force_N:20,duration_s:10,steps:200});show(project)});$('orbit').onclick=()=>safe(()=>{project=E.makePhysics('orbit',{body:'earth',altitude_m:400000,duration_s:5400,steps:600});show(project)});$('inspect').onclick=()=>safe(()=>show(E.inspect(project)));$('run').onclick=()=>safe(()=>{const x=E.execute(project);project=x.project;show(x.result)});$('verify').onclick=()=>safe(()=>show(E.verify(project)));$('edit').onclick=()=>safe(()=>{const x=E.edit(project,Number($('stage').value),$('field').value,Number($('value').value));project=x.project;show(x.comparison)});$('save').onclick=()=>safe(()=>{const b=new Blob([E.serialize(project)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='cas-engineering-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});$('import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;project=E.deserialize(await f.text());show(project)}catch(err){$('output').textContent='Error: '+err.message}};
</script></body></html>
